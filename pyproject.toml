[project]
name = "pushbuild-mcp"
version = "0.2.0"
description = "MCP server for 400+ official public-data APIs: elections, campaign finance, courts, permits, inspections, SEC filings, economic statistics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pushbuild-mcp = "pushbuild_mcp:main"

[project.urls]
Homepage = "https://pushbuild.com/apis/mcp.html"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
